name: CI Android - EcoCiente

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: "17"

  #valores fictícios usados somente durante o CI
  #ci não realiza login real com Facebook
  FACEBOOK_APP_ID: "000000000000000"
  FACEBOOK_LOGIN_PROTOCOL_SCHEME: "fb000000000000000"
  FACEBOOK_CLIENT_TOKEN: "ci-placeholder"

jobs:
  ci-android:
    name: Gradle, Java, Testes e Android

    runs-on: ubuntu-latest

    timeout-minutes: 25

    steps:
      - name: Baixar código
        uses: actions/checkout@v7

      - name: Validar Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Verificar versão do Java
        run: java -version

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Dar permissão ao Gradle Wrapper
        run: chmod +x ./gradlew

      - name: Verificar Gradle
        run: ./gradlew --version

      - name: Preparar google-services.json para compilacao
        shell: bash
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          set -euo pipefail
          if [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > app/google-services.json
          else
            echo "::notice::Config Firebase de compilacao (sem credenciais reais): testes de login nao executados na CI."
            python3 - <<'PY'
          import json
          from pathlib import Path

          config = {
              "project_info": {
                  "project_number": "488554144813",
                  "project_id": "ecociente-9325f",
                  "storage_bucket": "ecociente-9325f.firebasestorage.app",
              },
              "client": [{
                  "client_info": {
                      "mobilesdk_app_id": "1:488554144813:android:e33c599678c438638204a4",
                      "android_client_info": {"package_name": "com.example.ecociente"},
                  },
                  "api_key": [{"current_key": "ci-placeholder-not-a-real-firebase-key"}],
                  "oauth_client": [{
                      "client_id": "488554144813-i1bh7l5sipvh33478g6gottprk8mo06q.apps.googleusercontent.com",
                      "client_type": 3,
                  }],
              }],
              "configuration_version": "1",
          }

          Path("app/google-services.json").write_text(
              json.dumps(config), encoding="utf-8"
          )
          PY
          fi
          python3 -m json.tool app/google-services.json >/dev/null

      - name: Executar testes unitários
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - name: Executar Android Lint
        run: ./gradlew lintDebug --no-daemon --stacktrace

      - name: Compilar aplicativo Android
        run: ./gradlew assembleDebug --no-daemon --stacktrace